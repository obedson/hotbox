# Render Blueprint for Hotbox.
# Deploy at https://dashboard.render.com/blueprints by selecting this repository.
services:
  - type: web
    name: hotbox
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: cd ../frontend && NODE_ENV=development npm ci && npm run build && cd ../backend && npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://hotbox.onrender.com
